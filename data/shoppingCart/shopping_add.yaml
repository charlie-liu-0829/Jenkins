ids:
  - 添加商品到购物车成功
  - 添加失败，商品不存在或已下架

cases:
  - feature: 购物车模块
    story: 添加商品
    title: 添加商品成功
    request:
      method: POST
      url: ${API_BASE_URL}/api/cart/items
      json:
        "productId": 101
        "quantity": 1
    expected:
      status_code: 200
      code: 0
      msg: success


  - feature: 购物车模块
    story: 添加商品
    title: 商品不存在或已下架
    request:
      method: POST
      url: ${API_BASE_URL}/api/cart/items
      json:
        "productId": 25000
        "quantity": 1
    expected:
      status_code: 400
      code: 14001
      msg: 商品不存在或已下架
