ids:
  - 修改密码成功
  - 原密码不对，修改密码失败
  - 密码须为8-20位字母数字组合，修改密码失败
  - 两次输入的密码不一致，修改密码失败

cases:
  - feature: 用户模块
    story: 修改密码
    title: 修改成功
    request:
      method: PUT
      url: ${API_BASE_URL}/api/users/password
      json:
        oldPassword: "${TEST_USER_PASSWORD}"
        newPassword: "Test12345"
        confirmPassword: "Test12345"
    expected:
      status_code: 200
      code: 0
      msg: success

  - feature: 用户模块
    story: 修改密码
    title: 原密码不对
    request:
      method: PUT
      url: ${API_BASE_URL}/api/users/password
      json:
        oldPassword: "Test123"
        newPassword: "Test12345"
        confirmPassword: "Test12345"
    expected:
      status_code: 400
      code: 11010
      msg: 原密码不正确

  - feature: 用户模块
    story: 修改密码
    title: 密码须为8-20位字母数字组合
    request:
      method: PUT
      url: ${API_BASE_URL}/api/users/password
      json:
        oldPassword: "${TEST_USER_PASSWORD}"
        newPassword: "Test12345678910111213141516"
        confirmPassword: "Test12345678910111213141516"
    expected:
      status_code: 400
      code: 11003
      msg: 密码须为8-20位字母数字组合

  - feature: 用户模块
    story: 修改密码
    title: 两次输入的密码不一致
    request:
      method: PUT
      url: ${API_BASE_URL}/api/users/password
      json:
        oldPassword: "${TEST_USER_PASSWORD}"
        newPassword: "Test12345"
        confirmPassword: "Test123455"
    expected:
      status_code: 400
      code: 11004
      msg: 两次输入的密码不一致
