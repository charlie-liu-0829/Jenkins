ids:
  - 初始化商品成功
  - 初始化失败，商品不存在
  - 初始化失败，该商品库存已初始化
  - 初始化失败，初始库存数量必须大于0

cases:
  - feature: 库存模块
    story: 初始化库存
    title: 初始化成功
    request:
      method: POST
      url: ${API_BASE_URL}/api/admin/inventory
      json:
        "productId": 116
        "quantity": 100
    expected:
      status_code: 200
      code: 0
      msg: success

  - feature: 库存模块
    story: 初始化库存
    title: 商品不存在
    request:
      method: POST
      url: ${API_BASE_URL}/api/admin/inventory
      json:
        "productId": 25000
        "quantity": 100
    expected:
      status_code: 404
      code: 13001
      msg: 商品库存记录不存在

  - feature: 库存模块
    story: 初始化库存
    title: 该商品库存已初始化
    request:
      method: POST
      url: ${API_BASE_URL}/api/admin/inventory
      json:
        "productId": 116
        "quantity": 100
    expected:
      status_code: 400
      code: 13004
      msg: 该商品库存已初始化

  - feature: 库存模块
    story: 初始化库存
    title: 初始库存数量必须大于0
    request:
      method: POST
      url: ${API_BASE_URL}/api/admin/inventory
      json:
        "productId": 115
        "quantity": 0
    expected:
      status_code: 400
      code: 13002
      msg: 操作数量必须大于0
