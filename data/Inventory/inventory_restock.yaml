ids:
  - 补货成功
  - 补货失败，商品库存记录不存在
  - 补货失败，操作数量必须大于 0

cases:
  - feature: 库存模块
    story: 补充库存
    title: 初始化成功
    request:
      method: PUT
      url: ${API_BASE_URL}/api/admin/inventory/116/restock
      json:
        "quantity": 50
        "remark": "补货入库"
    expected:
      status_code: 200
      code: 0
      msg: success

  - feature: 库存模块
    story: 补充库存
    title: 商品库存记录不存在
    request:
      method: PUT
      url: ${API_BASE_URL}/api/admin/inventory/25000/restock
      json:
        "quantity": 50
        "remark": "补货入库"
    expected:
      status_code: 404
      code: 13001
      msg: 商品库存记录不存在

  - feature: 库存模块
    story: 补充库存
    title: 操作数量必须大于0
    request:
      method: PUT
      url: ${API_BASE_URL}/api/admin/inventory/116/restock
      json:
        "quantity": -1
        "remark": "补货入库"
    expected:
      status_code: 400
      code: 13002
      msg: 操作数量必须大于0
