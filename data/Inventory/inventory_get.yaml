ids:
  - 查询库存成功
  - 查询失败，商品库存记录不存在

cases:
  - feature: 库存模块
    story: 查询库存
    title: 查询成功
    request:
      method: GET
      url: ${API_BASE_URL}/api/products/101/inventory
    expected:
      status_code: 200
      code: 0
      msg: success

  - feature: 库存模块
    story: 补充库存
    title: 商品库存记录不存在
    request:
      method: GET
      url: ${API_BASE_URL}/api/products/25000/inventory
    expected:
      status_code: 404
      code: 13001
      msg: 商品库存记录不存在
