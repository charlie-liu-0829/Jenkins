ids:
  - 支付订单成功
  - 支付失败，订单不存在
  - 支付失败，无权限操作该订单


cases:
  - feature: 订单模块
    story: 支付订单
    title: 支付订单成功
    request:
      method: PUT
      url: ${API_BASE_URL}/api/orders/11/pay
    expected:
      status_code: 200
      code: 0
      msg: success

  - feature: 订单模块
    story: 支付订单
    title: 订单不存在
    request:
      method: PUT
      url: ${API_BASE_URL}/api/orders/25000/pay
    expected:
      status_code: 404
      code: 15006
      msg: 订单不存在

  - feature: 订单模块
    story: 支付订单
    title: 无权限操作该订单
    request:
      method: PUT
      url: ${API_BASE_URL}/api/orders/6/pay
    expected:
      status_code: 403
      code: 15007
      msg: 无权限操作该订单
