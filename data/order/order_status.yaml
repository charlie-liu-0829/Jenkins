ids:
  - 订单状态查询成功
  - 查询失败，订单不存在

cases:
  - feature: 订单模块
    story: 订单状态查询
    title: 订单确认收货成功
    request:
      method: GET
      url: ${API_BASE_URL}/api/orders/15/status-logs
    expected:
      status_code: 200
      code: 0
      msg: success

  - feature: 订单模块
    story: 订单状态查询
    title: 订单不存在
    request:
      method: GET
      url: ${API_BASE_URL}/api/orders/25000/status-logs
    expected:
      status_code: 404
      code: 15006
      msg: 订单不存在
