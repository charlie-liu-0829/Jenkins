ids:
  - 修改商品分类成功
  - 修改失败，分类不存在

cases:
  - feature: 商品模块
    story: 修改商品分类
    title: 修改成功
    request:
      method: PUT
      url: ${API_BASE_URL}/api/admin/categories/25
      json:
        "name": "测试分类_电子产品"
        "parentId": 0
        "sort": 2
    expected:
      status_code: 200
      code: 0
      msg: success

  - feature: 商品模块
    story: 修改商品分类
    title: 分类不存在
    request:
      method: PUT
      url: ${API_BASE_URL}/api/admin/categories/25000
      json:
        "name": "测试分类_电子产品"
        "parentId": 0
        "sort": 2
    expected:
      status_code: 404
      code: 12003
      msg: 分类不存在
